<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments">
    </ul>
    <div class="add-form">
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Написать</button>
      </div>
    </div>
  </div>
</body>

<script>
  "use strict";
  const commentsContainer = document.querySelector('.comments')
  const commentInput = document.querySelector('.add-form-name')
  const commentText = document.querySelector('.add-form-text')
  const commentLikes = document.querySelector('.likes-counter')
  const commentBtn = document.querySelector('.add-form-button')
  const commentLi = document.querySelector('.comment')
  const commentLikeBtn = document.getElementById('cooment-like--btn')
  const validateInput = () => {
    if (commentInput.value === '' || commentText.value === '') {
      commentBtn.disabled = true
    } else {
      commentBtn.disabled = false;
    }
  }

  const errorMoment = (text) => {
    return text.replaceAll("<", "&lt;").replaceAll(">", "&gt;");

  }

  const comments = [
    {
      name: 'Глеб Фокин',
      date: '12.02.22 12:18',
      text: 'Это будет первый комментарий на этой странице',
      likes: 3,
      isLikes: false,
    },

    {
      name: 'Варвара Н.',
      date: '13.02.22 19:22',
      text: 'Мне нравится как оформлена эта страница! ❤',
      likes: 75,
      isLikes: true,
    }
  ]

  commentsContainer.addEventListener('click', (e) => {
    if (e.target.classList.contains('like-button')) {
      const index = Number(e.target.dataset.index)
      const comment = comments[index]
      if (comment.isLikes) {
        comment.likes--
        comment.isLikes = false
      } else if (!comment.isLikes) {
        comment.likes++
        comment.isLikes = true
      }
    } else {
      return;
    }

    commentsRender()
  })

  const commentsRender = () => {
    const commentElement = comments.map((comment, index) => {
      return `<li data-index="${index}" class="comment">
        <div class="comment-header">
          <div class="comment-name">${errorMoment(comment.name)}</div>
          <div class="commnet-date">${comment.date}</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            ${errorMoment(comment.text)}
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">${comment.likes}</span>
            <button id='comment-like--btn' data-index='${index}' class='${comment.isLikes ? "like-button -active-like" : "like-button"}'></button>
          </div>
        </div>
      </li>`
    }).join("")

    commentsContainer.innerHTML = commentElement
  }

  commentsRender()

  commentInput.addEventListener('input', () => {
    validateInput()
  })

  commentText.addEventListener('input', () => {
    validateInput()
  })

  commentBtn.addEventListener('click', () => {

    if (commentInput.value === '' || commentText.value === '') {
      alert('Заполните поля');
      return;
    }
    const commentDate = new Date()
    const commentTime = (`${commentDate.getDate()}.${(commentDate.getMonth() + 1) < 10 ? '0' + (commentDate.getMonth() + 1) : (commentDate.getMonth() + 1)}.${commentDate.getFullYear()} ${commentDate.getHours()}:${commentDate.getMinutes()}`)
    const newCommentLi = {
      name: commentInput.value,
      date: commentTime,
      text: commentText.value,
      likes: 0,
      isLikes: false
    }
    comments.push(newCommentLi)
    commentsRender()
    commentInput.value = ''
    commentText.value = ''
  })

  commentsContainer.addEventListener('click', (e) => {
    const newCommentForm = e.target.closest('.comment')
    if (e.target.classList.contains('like-button')) {
      return;
    }
    else if (newCommentForm) {
      const commentForm = newCommentForm.dataset.index
      const commentArr = comments[commentForm]
      const commentName = commentArr.name
      const commentTextForm = commentArr.text
      commentText.value = `> ${commentName}, ${commentTextForm}\n\n`
    }
    validateInput();
    commentText.focus();
  })



  console.log("It works!");
</script>

</html>
