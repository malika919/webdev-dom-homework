<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments">
      <li class="comment">
        <div class="comment-header">
          <div class="comment-name">Глеб Фокин</div>
          <div class="commnet-date">12.02.22 12:18</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            Это будет первый комментарий на этой странице
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">3</span>
            <button class="like-button"></button>
          </div>
        </div>
      </li>
      <li class="comment">
        <div class="comment-header">
          <div class="comment-name">Варвара Н.</div>
          <div class="commnet-date">13.02.22 19:22</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            Мне нравится как оформлена эта страница! ❤
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">75</span>
            <button class="like-button -active-like"></button>
          </div>
        </div>
      </li>
    </ul>
    <div class="add-form">
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Написать</button>
      </div>
    </div>
  </div>
</body>

<script>
  "use strict";
  const commentsContainer = document.querySelector('.comments')
  const commentInput = document.querySelector('.add-form-name')
  const commentText = document.querySelector('.add-form-text')
  const commentLikes = document.querySelector('.likes-counter')
  const commentBtn = document.querySelector('.add-form-button')
  const commentLi = document.querySelector('.comment')
  const validateInput = () => {
    if (commentInput.value === '' || commentText.value === '') {
      commentBtn.disabled = true
    } else {
      commentBtn.disabled = false;
    }
  }

  commentInput.addEventListener('input', () => {
    validateInput()
  })

  commentText.addEventListener('input', () => {
    validateInput()
  })

  commentBtn.addEventListener('click', () => {
    const commentDate = new Date()
    const commentTime = (`${commentDate.getDate()}.${(commentDate.getMonth() + 1) < 10 ? '0' + (commentDate.getMonth() + 1) : (commentDate.getMonth() + 1)}.${commentDate.getFullYear()} ${commentDate.getHours()}:${commentDate.getMinutes()}`)
    const newCommentLi = `<li class="comment">
        <div class="comment-header">
          <div class="comment-name">${commentInput.value}</div>
          <div class="commnet-date">${commentTime}</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            ${commentText.value}
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">0</span>
            <button class="like-button"></button>
          </div>
        </div>
      </li>`
    commentsContainer.innerHTML += newCommentLi
  })

  console.log("It works!");
</script>

</html>
